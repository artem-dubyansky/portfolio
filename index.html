<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#080c14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Онлайн-портфолио и навигатор профильного поступления</title>

    <meta name="description" content="Инженерное портфолио ученика 8 Д класса с прикреплением грамот, картой компетенций и расчетом поступления C++ WebAssembly.">
    <meta name="author" content="Дубянский Артём">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-badge">8 «Д» класс • МГТУ им. Н.Э. Баумана • Школа № 1580</div>
            <h1>Онлайн-портфолио</h1>
            <p>Профориентация, достижения и навигатор профильного поступления</p>
            <div id="pwa-install-banner" style="display: none; margin-top: 10px;">
                <button id="pwa-install-btn" class="btn-secondary" style="font-size: 12px; padding: 6px 14px; border-color: #3b82f6; color: #60a5fa;">
                    📲 Установить как приложение на экран телефона
                </button>
            </div>
        </header>

        <nav class="tabs-nav">
            <button class="tab-btn" data-tab="0">Тестирование</button>
            <button class="tab-btn active" data-tab="1">Анкета и Портфолио</button>
            <button class="tab-btn" data-tab="2">Навигатор школ (C++)</button>
        </nav>

        <main class="content-card" id="main-content">
            <h2>Загрузка модуля...</h2>
        </main>
    </div>

    <!-- Модальное окно просмотра бланка А4 -->
    <div id="print-modal" class="modal-overlay" style="display: none;">
        <div class="modal-window">
            <div class="modal-top-bar no-print">
                <span style="font-weight: 700; font-size: 13px;">Официальный бланк портфолио</span>
                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                    <button id="modal-doc-action" class="btn-action-doc">📥 В Word (.doc)</button>
                    <button id="modal-print-action" class="btn-action-print">🖨️ Печать / PDF</button>
                    <button id="modal-close-action" class="btn-action-close">✕</button>
                </div>
            </div>
            <div id="print-sheet-content" class="printable-sheet"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
